CONFIG_ZMK_KEYBOARD_NAME="Crkbd-ZMK"

# Set sleep timeout to 30 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Increase wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Macro debouncing
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=8
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=8

# Nice!view display
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# BLE experimental
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Pointing enabledz
CONFIG_ZMK_POINTING=y

# Raw HID enabled
CONFIG_RAW_HID=y
CONFIG_ZMK_BEHAVIOR_AUTO_MOUSE_LAYER_TIMEOUT_MS=400
CONFIG_ZMK_HID_INDICATORS=y