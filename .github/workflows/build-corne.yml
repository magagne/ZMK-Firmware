name: Build Corne

on:
  push:
    paths:
      - 'config/corne/**'
      - 'config/corne.conf'
      - 'config/corne.keymap'
      - 'config/corne.json'
      - 'config/common/**'
      - 'config/west.yml'
      - 'zephyr/**'
      - 'build/corne.yaml'
      - '.github/workflows/build-corne.yml'
  pull_request:
    paths:
      - 'config/corne/**'
      - 'config/corne.conf'
      - 'config/corne.keymap'
      - 'config/corne.json'
      - 'config/common/**'
      - 'config/west.yml'
      - 'zephyr/**'
      - 'build/corne.yaml'
      - '.github/workflows/build-corne.yml'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
    with:
      build_matrix_path: build/corne.yaml
